<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator - UtilityNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                🛠️ UtilityNest
            </a>
            <span class="text-xs bg-blue-600 text-white px-3 py-1 rounded-full font-medium">Calculators</span>
        </div>
    </header>

    <!-- Main Tool Container -->
    <main class="max-w-3xl mx-auto w-full px-4 my-10 flex-grow">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2 text-center">Quick Percentage Calculator</h2>
            <p class="text-slate-400 text-center text-sm mb-6">Calculate what percentage one number is of another instantly.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">What is</label>
                    <input type="number" id="val-part" placeholder="e.g. 45" oninput="calculatePercentage()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Percent (%) of Total</label>
                    <input type="number" id="val-total" placeholder="e.g. 150" oninput="calculatePercentage()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- Result -->
            <div class="bg-slate-900 border border-slate-700 p-6 rounded-xl text-center">
                <span class="text-xs text-slate-400 uppercase tracking-widest">Calculated Result</span>
                <div id="calc-result" class="text-3xl font-extrabold text-blue-400 mt-1">0.00%</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 UtilityNest. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        function calculatePercentage() {
            const part = parseFloat(document.getElementById('val-part').value) || 0;
            const total = parseFloat(document.getElementById('val-total').value) || 0;

            if(total === 0) {
                document.getElementById('calc-result').innerText = "0.00%";
                return;
            }

            const result = (part / total) * 100;
            document.getElementById('calc-result').innerText = result.toFixed(2) + '%';
        }
    </script>
</body>
</html>

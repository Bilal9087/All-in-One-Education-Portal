<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - UtilityNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                🛠️ UtilityNest
            </a>
            <span class="text-xs bg-blue-600 text-white px-3 py-1 rounded-full font-medium">Generators</span>
        </div>
    </header>

    <!-- Main Tool Container -->
    <main class="max-w-3xl mx-auto w-full px-4 my-10 flex-grow">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-xl text-center">
            <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2">QR Code Generator</h2>
            <p class="text-slate-400 text-sm mb-6">Enter text or URL to generate a custom QR code instantly.</p>

            <div class="mb-6 max-w-md mx-auto">
                <input type="text" id="qr-text" placeholder="Enter URL or Text here..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 mb-4">
                <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg">Generate QR Code</button>
            </div>

            <!-- Result QR Box -->
            <div id="qr-box" class="hidden bg-slate-900 border border-slate-700 p-6 rounded-xl inline-block">
                <img id="qr-image" src="" alt="QR Code" class="mx-auto rounded-lg shadow-md mb-4 max-w-[200px]">
                <a id="download-qr" download="qrcode.png" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-xl text-xs transition inline-block">Download QR Code</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 UtilityNest. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        function generateQR() {
            const text = document.getElementById('qr-text').value.trim();
            if(!text) {
                alert("Please enter some text or URL!");
                return;
            }

            // Using free public QR Server API
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
            
            document.getElementById('qr-image').src = qrUrl;
            document.getElementById('download-qr').href = qrUrl;
            document.getElementById('qr-box').classList.remove('hidden');
        }
    </script>
</body>
</html>
